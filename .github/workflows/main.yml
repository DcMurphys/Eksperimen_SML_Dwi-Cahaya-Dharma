# Action workflow metadata
name: Data Preprocessing Automation

# Trigger action
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mengatur hak akses repository ke 'write'
permissions: 
  contents: write

# Eksekusi job task
jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: 1) Checkout repository
      uses: actions/checkout@v4

    - name: 2) Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.5'

    - name: 3) Install Dependencies listed on requirements
      run: | 
        python -m pip install --upgrade pip
        pip install -r .github/workflows/requirements.txt

    - name: 4) Run preprocessing script file 
      run: python preprocessing/automate_Dwi-Cahaya-Dharma.py 
      
    - name: 5) Upload scaler, encoder, and PCA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scaler-pca-encoder-artifacts
        path: |
          preprocessing/scaler/
          preprocessing/pca/
          preprocessing/encoder/
          
    - name: 6) Commit and push remaining processed files from preprocessing script file
      run: | 
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add preprocessing/telco_preprocessing/

        git diff --quiet && git diff --staged --quiet || (git commit -m "Update preprocessed datasets" && git push)
